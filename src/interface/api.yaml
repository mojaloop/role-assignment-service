openapi: 3.1.0
info:
  title: Mojaloop Role Assignment Service
  version: '1.0'
  description: >-
    A Mojaloop API for users, operators or applications to assign roles and
    participants to users.
  license:
    name: TBD
    url: TBD
servers:
  - url: /
paths:
  /health:
    get:
      operationId: HealthGet
      security: []
      x-authz:
        internal: true
      summary: Health check endpoint
      description: >-
        The HTTP request GET /health is used to return the current status of the
        API.
      tags:
        - health
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'

  /metrics:
    get:
      operationId: MetricsGet
      security: []
      x-authz:
        internal: true
      summary: Prometheus metrics endpoint
      description: The HTTP request GET /metrics is used to return metrics for the API.
      tags:
        - health
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'

  /users:
    get:
      operationId: UsersGet
      summary: Lists the operators known to the platform
      # Operators are administered as one set
      x-authz:
        scopedBy: []
      security:
      - session: []
      description: >-
        The HTTP request GET /users is used to return a list of user.
        Retrieves the identities known to Kratos.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersGetResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'

  /users/{ID}:
    parameters:
      - name: ID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: UsersIDGet
      summary: Returns one operator
      x-authz:
        scopedBy: []
      security:
      - session: []
      description: >-
        The HTTP request GET /users is used to return a specific user.
        Retrieves an identity from Kratos.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersIDGetResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'

  /resources:
    get:
      operationId: ResourcesGet
      summary: Lists the resources a role can be assigned over
      x-authz:
        scopedBy: []
      security:
      - session: []
      description: >-
        The resources that exist, optionally of one resource name, as the
        services that own them reported. These are what an operator chooses
        among when a role leaves a resource name open.
      parameters:
        - name: resourceName
          in: query
          required: false
          description: One resource name, such as Participant or Report
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcesGetResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'

  /roles:
    get:
      operationId: RolesGet
      summary: Lists the roles that can be assigned
      x-authz:
        scopedBy: []
      security:
      - session: []
      description: >-
        The HTTP request GET /roles is used to return a list of role ids.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolesGetResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'

  /users/{ID}/assignments:
    parameters:
      - name: ID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: UsersIDAssignmentsGet
      summary: Returns what an operator holds
      x-authz:
        scopedBy: []
      security:
      - session: []
      description: >-
        One entry per role the user holds, carrying the arguments it was given.
        A role that takes arguments appears once per set of them.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersIDAssignmentsGetResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'
    patch:
      operationId: UsersIDAssignmentsPatch
      summary: Changes what an operator holds
      x-authz:
        scopedBy: []
      security:
      - session: []
      description: >-
        Adds or removes one role at a time, each with the arguments that say
        what it is over. The IAM refuses an argument naming a resource that
        does not exist, and those refusals come back rather than being applied
        in part and reported as success.
      requestBody:
        required: true
        content:
           application/json:
              schema:
                $ref: '#/components/schemas/UsersIDAssignmentsPatchRequest'
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '501':
          $ref: '#/components/responses/501'
        '503':
          $ref: '#/components/responses/503'

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ory_kratos_session
      description: A human's browser session
  responses:
    '200':
      description: OK
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInformationResponse'
      headers:
        Content-Length:
          $ref: '#/components/headers/Content-Length'
        Content-Type:
          $ref: '#/components/headers/Content-Type'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInformationResponse'
      headers:
        Content-Length:
          $ref: '#/components/headers/Content-Length'
        Content-Type:
          $ref: '#/components/headers/Content-Type'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInformationResponse'
      headers:
        Content-Length:
          $ref: '#/components/headers/Content-Length'
        Content-Type:
          $ref: '#/components/headers/Content-Type'
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInformationResponse'
      headers:
        Content-Length:
          $ref: '#/components/headers/Content-Length'
        Content-Type:
          $ref: '#/components/headers/Content-Type'
    '405':
      description: Method Not Allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInformationResponse'
      headers:
        Content-Length:
          $ref: '#/components/headers/Content-Length'
        Content-Type:
          $ref: '#/components/headers/Content-Type'
    '406':
      description: Not Acceptable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInformationResponse'
      headers:
        Content-Length:
          $ref: '#/components/headers/Content-Length'
        Content-Type:
          $ref: '#/components/headers/Content-Type'
    '501':
      description: Not Implemented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInformationResponse'
      headers:
        Content-Length:
          $ref: '#/components/headers/Content-Length'
        Content-Type:
          $ref: '#/components/headers/Content-Type'
    '503':
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorInformationResponse'
      headers:
        Content-Length:
          $ref: '#/components/headers/Content-Length'
        Content-Type:
          $ref: '#/components/headers/Content-Type'
  headers:
    Content-Length:
      required: false
      schema:
        type: integer
      description: >-
        The `Content-Length` header field indicates the anticipated size of the
        payload body. Only sent if there is a body.


        **Note:** The API supports a maximum size of 5242880 bytes (5
        Megabytes).
    Content-Type:
      schema:
        type: string
      required: true
      description: >-
        The `Content-Type` header indicates the specific version of the API used
        to send the payload body.
  schemas:
    User:
      title: User
      type: object
    UsersGetResponse:
      title: UsersGetResponse
      type: object
      description: >-
        A list of users.
      required:
      - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    UsersIDGetResponse:
      title: UsersIDGetResponse
      type: object
      description: >-
        A user of a specified ID.
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/User'
    Resource:
      title: Resource
      type: object
      description: One resource an operator can grant a role over.
      required:
      - resourceName
      - id
      properties:
        resourceName:
          type: string
          description: The deployment's resource name the resource is filed under
        id:
          type: string
    ResourcesGetResponse:
      title: ResourcesGetResponse
      type: object
      description: The resources that exist.
      required:
      - resources
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
    Role:
      title: Role
      type: object
      description: A role, and the resource names an assignment must name.
      required:
      - name
      - open
      properties:
        name:
          type: string
        open:
          type: array
          description: >-
            The resource names the role's grants leave open, each the list an
            operator picks a resource from. Empty for a role held as it is.
          items:
            type: string
    RolesGetResponse:
      title: RolesGetResponse
      type: object
      description: The roles a deployment defined.
      required:
      - roles
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    Assignment:
      title: Assignment
      type: object
      description: One role a user holds, and what it is over.
      required:
      - role
      properties:
        role:
          type: string
        resources:
          type: object
          description: One resource id per resource name the role leaves open.
          additionalProperties:
            type: string
    UsersIDAssignmentsGetResponse:
      title: UsersIDAssignmentsGetResponse
      type: object
      description: What a user holds.
      required:
      - assignments
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
    UsersIDAssignmentsPatchRequest:
      type: object
      required:
      - assignmentOperations
      properties:
        assignmentOperations:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Assignment'
            - type: object
              required:
              - action
              properties:
                action:
                  type: string
                  enum:
                    - insert
                    - delete
    ErrorCode:
      title: ErrorCode
      type: string
      pattern: '^[1-9]\d{3}$'
      description: >-
        The API data type ErrorCode is a JSON String of four characters,
        consisting of digits only. Negative numbers are not allowed. A leading
        zero is not allowed. Each error code in the API is a four-digit number,
        for example, 1234, where the first number (1 in the example) represents
        the high-level error category, the second number (2 in the example)
        represents the low-level error category, and the last two numbers (34 in
        the example) represent the specific error.
      example: '5100'
    ErrorDescription:
      title: ErrorDescription
      type: string
      minLength: 1
      maxLength: 128
      description: Error description string.
    ExtensionKey:
      title: ExtensionKey
      type: string
      minLength: 1
      maxLength: 32
      description: Extension key.
    ExtensionValue:
      title: ExtensionValue
      type: string
      minLength: 1
      maxLength: 128
      description: Extension value.
    Extension:
      title: Extension
      type: object
      description: Data model for the complex type Extension.
      properties:
        key:
          $ref: '#/components/schemas/ExtensionKey'
        value:
          $ref: '#/components/schemas/ExtensionValue'
      required:
        - key
        - value
    ExtensionList:
      title: ExtensionList
      type: object
      description: >-
        Data model for the complex type ExtensionList. An optional list of
        extensions, specific to deployment.
      properties:
        extension:
          type: array
          items:
            $ref: '#/components/schemas/Extension'
          minItems: 1
          maxItems: 16
          description: Number of Extension elements.
      required:
        - extension
    ErrorInformation:
      title: ErrorInformation
      type: object
      description: Data model for the complex type ErrorInformation.
      properties:
        errorCode:
          $ref: '#/components/schemas/ErrorCode'
        errorDescription:
          $ref: '#/components/schemas/ErrorDescription'
        extensionList:
          $ref: '#/components/schemas/ExtensionList'
      required:
        - errorCode
        - errorDescription
    ErrorInformationResponse:
      title: ErrorInformationResponse
      type: object
      description: >-
        Data model for the complex type object that contains an optional element
        ErrorInformation used along with 4xx and 5xx responses.
      properties:
        errorInformation:
          $ref: '#/components/schemas/ErrorInformation'
