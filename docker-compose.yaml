networks:
  mojaloop-net:
    name: mojaloop-net

volumes:
  authz-bundle:

services:
  role-assignment-service:
    container_name: role-assignment-service
    image: mojaloop/role-assignment-service
    build:
      context: .
      cache_from:
        - mojaloop/role-assignment-service
    deploy:
      mode: replicated
      replicas: 1
    ports:
      - "3008:3008"
    environment:
      - ROLE_ASSIGNMENT_SERVICE_IAM_SERVICE_URL=http://iam-provisioning:3003
    networks:
      - mojaloop-net
    depends_on:
      iam-provisioning:
        condition: service_healthy
      kratos:
        condition: service_healthy
    healthcheck:
      test: wget -q http://172.17.0.1:3008/health -O /dev/null || exit 1
      timeout: 20s
      retries: 30
      interval: 15s

  # This service's own document, turned into the gateway rules, the Keto model
  # and the catalog the IAM validates roles against.
  prepare-authz:
    image: mojaloop/ml-iam-services:local
    # A fresh named volume belongs to root, and this writes into it once
    user: root
    command:
      - authzgen
      - --spec=/spec/api.yaml
      - --out=/bundle
      - --host=role-assignment-service
    volumes:
      - ./src/interface/api.yaml:/spec/api.yaml:ro
      - authz-bundle:/bundle
    restart: "no"

  # Roles, resources and assignments live here; nothing else writes to Keto.
  iam-provisioning:
    image: mojaloop/ml-iam-services:local
    command:
      - provisioning
      - --roles=/default-roles.json
      - --catalog=/bundle/catalog.json
    environment:
      - PORT=3003
      - KETO_WRITE_URL=http://keto:4467
      - KETO_READ_URL=http://keto:4466
      - KRATOS_ADMIN_URL=http://kratos:4434
      - IAM_ADMIN_EMAIL=${IAM_ADMIN_EMAIL:-admin@iam.local}
      - IAM_ADMIN_PASSWORD=${IAM_ADMIN_PASSWORD:-admin1234}
      - IAM_HUB_ADMIN_ROLE=${IAM_HUB_ADMIN_ROLE:-iam-admin}
    volumes:
      - ./docker/default-roles.json:/default-roles.json:ro
      - authz-bundle:/bundle:ro
    networks:
      - mojaloop-net
    depends_on:
      keto:
        condition: service_healthy
      kratos:
        condition: service_healthy
      prepare-authz:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3003/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  keto:
    container_name: keto
    image: oryd/keto:v26.2.0
    ports:
      - '4466:4466' # Read port
      - '4467:4467' # Write port
    volumes:
      - ./docker/keto.yml:/opt/keto/keto.yml:ro
      - authz-bundle:/etc/keto-namespaces:ro
    command: serve --config /opt/keto/keto.yml
    networks:
      - mojaloop-net
    depends_on:
      prepare-authz:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:4466/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  kratos:
    container_name: kratos
    image: oryd/kratos:v26.2.0
    ports:
      - '4433:4433' # Public port
      - '4434:4434' # Admin port
    volumes:
      - ./docker/kratos:/etc/config/kratos:ro
    command: serve --dev --config /etc/config/kratos/kratos.yml
    networks:
      - mojaloop-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:4433/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  central-ledger:
    image: mojaloop/central-ledger:v17.6.0
    container_name: central-ledger
    command: sh -c "/opt/app/scripts/wait4.js central-ledger && node src/api/index.js"
    ports:
      - "3001:3001"
    volumes:
      - ./docker/central-ledger/default.json:/opt/app/config/default.json
      - ./scripts/wait4.js:/opt/app/scripts/wait4.js
      - ./scripts/wait4.config.js:/opt/app/scripts/wait4.config.js
    environment:
      - LOG_LEVEL=info
      - CLEDG_MONGODB__DISABLED=false
    networks:
      - mojaloop-net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: wget -q http://localhost:3001/health -O /dev/null || exit 1
      timeout: 20s
      retries: 30
      interval: 30s
      start_period: 30s
    user: root

  objstore:
    image: mongo:latest
    container_name: objstore
    deploy:
      replicas: 1
    # Disable logging as it is far too verbose for debugging locally
    logging:
      driver: none
    ports:
      - "27017:27017"
    networks:
      - mojaloop-net
    # healthcheck:
    #   test: mongo --eval 'db.runCommand("ping").ok' localhost:27017/test --quiet
    #   interval: 10s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 40s

  mysql:
    image: mysql/mysql-server
    container_name: mysql
    ports:
      - "3307:3306"
    volumes:
      # Note: this fixes the permissions issue, but docker-compose up will fail on first attempt
      - ./docker/sql-init/:/docker-entrypoint-initdb.d/
    environment:
      - MYSQL_USER=${DBUSER:-central_ledger}
      - MYSQL_PASSWORD=${DBPASS:-password}
      - MYSQL_DATABASE=${DBUSER:-central_ledger}
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
    networks:
      - mojaloop-net
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "mysql"]
      timeout: 20s
      retries: 10
      start_period: 40s
      interval: 30s

