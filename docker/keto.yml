version: v0.12.0

log:
  level: info

# Staged models are one concatenated file: Keto parses each location file
# self-contained, and a directory of bundle files silently drops all but one
# file when the shared User/Role stubs duplicate
namespaces:
  location: file:///etc/keto-namespaces/keto-namespaces.ts

dsn: memory

serve:
  read:
    host: 0.0.0.0
    port: 4466
  write:
    host: 0.0.0.0
    port: 4467
